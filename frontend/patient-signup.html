<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Sign Up — HAMS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="index.html">HAMS</a>
    <div class="nav-links">
      <a href="patient-login.html">Login</a>
    </div>
  </nav>

  <div class="container-narrow" style="margin-top:40px;">
    <div class="card">
      <h2>Patient Sign Up</h2>
      <div id="msg" class="msg"></div>
      <form id="signupForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
          <span class="text-muted">Must include uppercase, lowercase, digit & special char</span>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="sex">Sex</label>
            <select id="sex" required>
              <option value="M">Male</option>
              <option value="F">Female</option>
            </select>
          </div>
          <div class="form-group">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" min="1" required />
          </div>
        </div>
        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Sign Up</button>
      </form>
      <p class="text-center mt-16 text-muted">Already have an account? <a href="patient-login.html">Login</a></p>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.className = "msg";
      msg.textContent = "";

      const body = {
        username: document.getElementById("username").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        sex: document.getElementById("sex").value,
        weight: parseInt(document.getElementById("weight").value),
        DOB: document.getElementById("dob").value, // YYYY-MM-DD
      };

      try {
        const res = await fetch(`${API_BASE}/auth/signup/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (res.ok) {
          showMsg(msg, "Account created! Redirecting to login…", "success");
          setTimeout(() => (window.location.href = "patient-login.html"), 1500);
        } else {
          const errText = Object.entries(data).map(([k,v]) => `${k}: ${Array.isArray(v) ? v.join(", ") : JSON.stringify(v)}`).join("\n");
          showMsg(msg, errText, "error");
        }
      } catch (err) {
        showMsg(msg, "Network error. Is the server running?", "error");
      }
    });
  </script>
</body>
</html>
